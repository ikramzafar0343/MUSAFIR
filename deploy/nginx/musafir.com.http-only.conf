# HTTP-only bootstrap (legacy musafir.com archive)
# Production hostname is musafirss.store — use musafirss.store.http-only.conf instead.
# Prefer the TLS config (musafirss.store.conf) once certs exist.
# Include deploy/nginx/musafir-map.conf in http{} for $connection_upgrade.

server {
    listen 80;
    listen [::]:80;
    server_name musafir.com www.musafir.com;
    client_max_body_size 55m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $musafir_api http://musafir-backend-1:5000;
        proxy_pass $musafir_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /uploads/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $musafir_api http://musafir-backend-1:5000;
        proxy_pass $musafir_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        expires 7d;
    }

    location ^~ /_next/static/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $musafir_fe http://musafir-frontend-1:3020;
        proxy_pass $musafir_fe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /assets/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $musafir_fe http://musafir-frontend-1:3020;
        proxy_pass $musafir_fe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $musafir_fe http://musafir-frontend-1:3020;
        proxy_pass $musafir_fe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
