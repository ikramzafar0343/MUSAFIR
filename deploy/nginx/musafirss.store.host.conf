# Host nginx (Ubuntu) — same pattern as zermae.com / marhas.pk on the shared VPS.
# Docker publishes: FE 127.0.0.1:3020, API 127.0.0.1:5010
# Enable after certbot, or use HTTP-only bootstrap first (see HOSTINGER.md).

upstream musafir_web { server 127.0.0.1:3020; keepalive 32; }
upstream musafir_api { server 127.0.0.1:5010; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name musafirss.store www.musafirss.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://musafirss.store$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.musafirss.store;
    client_max_body_size 55m;

    ssl_certificate     /etc/letsencrypt/live/musafirss.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musafirss.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://musafirss.store$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name musafirss.store;
    client_max_body_size 55m;

    ssl_certificate     /etc/letsencrypt/live/musafirss.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musafirss.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://musafir_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /uploads/ {
        proxy_pass http://musafir_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;
        proxy_buffering off;
        proxy_read_timeout 120s;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://musafir_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
