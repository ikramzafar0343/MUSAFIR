# Include this file inside the main nginx `http { }` block, e.g.:
#   include /var/www/musafir/deploy/nginx/musafir-map.conf;
# (or copy it next to other conf.d map snippets).
# Required for `$connection_upgrade` used by musafir.com.conf.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
